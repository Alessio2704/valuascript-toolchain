name: "Build ValuaScript"
description: "Configures CMake and builds the project"

inputs:
  cmake_preset:
    description: "The CMake preset to use (Debug, Release, RelWithDebInfo)"
    required: true
    default: "Release"

runs:
  using: "composite"
  steps:
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ matrix.asset_name_suffix || 'default' }}

    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cmake -G Ninja --preset ${{ inputs.cmake_preset }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Set up MSVC Developer Command Prompt
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.msvc_arch }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        MSYS_NO_PATHCONV=1 cmake -G Ninja --preset ${{ inputs.cmake_preset }} \
          -DCMAKE_C_COMPILER=cl \
          -DCMAKE_CXX_COMPILER=cl \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="/Z7 /MP /EHsc" \
          -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO /OPT:REF /OPT:ICF /DEBUG:NONE" \
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
          -DINTERPROCEDURAL_OPTIMIZATION=OFF

    - name: Build CMake Project
      shell: bash
      run: cmake --build --preset ${{ inputs.cmake_preset }} -j
