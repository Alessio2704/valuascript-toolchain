name: "Build and Test ValuaScript"
description: "Checks out code, builds and tests the project"

inputs:
  cmake_preset:
    description: "The CMake preset to use (Debug, Release, RelWithDebInfo)"
    required: true
    default: "Release"
  fuzz_iterations:
    description: "Number of iterations for the fuzzer"
    required: false
  expansion_depth:
    description: "Max expansion depth for tests"
    required: false
  expansion_recursion:
    description: "Max expansion recursion for tests"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ matrix.asset_name_suffix || 'default' }}

    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cmake -G Ninja --preset ${{ inputs.cmake_preset }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Set up MSVC Developer Command Prompt
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.msvc_arch }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        MSYS_NO_PATHCONV=1 cmake -G Ninja --preset ${{ inputs.cmake_preset }} \
          -DCMAKE_C_COMPILER=cl \
          -DCMAKE_CXX_COMPILER=cl \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="/Z7 /MP /EHsc" \
          -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO /OPT:REF /OPT:ICF /DEBUG:NONE" \
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
          -DINTERPROCEDURAL_OPTIMIZATION=OFF

    - name: Build CMake Project
      shell: bash
      run: cmake --build --preset ${{ inputs.cmake_preset }} -j

    - name: Run C++ Engine Tests
      shell: bash
      run: |
        CORES=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
        echo "Running CTest with $CORES cores..."

        [ -n "${{ inputs.fuzz_iterations }}" ] && export FUZZ_ITERATIONS=${{ inputs.fuzz_iterations }}
        [ -n "${{ inputs.expansion_depth }}" ] && export EXPANSION_DEPTH=${{ inputs.expansion_depth }}
        [ -n "${{ inputs.expansion_recursion }}" ] && export EXPANSION_RECURSION=${{ inputs.expansion_recursion }}
        
         ctest --preset ${{ inputs.cmake_preset }} -j $CORES