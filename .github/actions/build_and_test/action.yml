name: "Build and Test ValuaScript"
description: "Checks out code, builds and tests the project"

runs:
  using: "composite"
  steps:
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ matrix.asset_name_suffix || 'default' }}

    - name: Install Ninja and GCC 13 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-13 g++-13

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc-13 \
          -DCMAKE_CXX_COMPILER=g++-13 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Set up MSVC Developer Command Prompt
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.msvc_arch }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        MSYS_NO_PATHCONV=1 cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=cl \
          -DCMAKE_CXX_COMPILER=cl \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="/Z7 /MP /EHsc" \
          -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO /OPT:REF /OPT:ICF /DEBUG:NONE" \
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
          -DINTERPROCEDURAL_OPTIMIZATION=OFF

    - name: Build CMake Project
      shell: bash
      run: cmake --build build --config Release -j

    - name: Run C++ Engine Tests
      shell: bash
      run: |
        cd build
        ctest --verbose --output-on-failure