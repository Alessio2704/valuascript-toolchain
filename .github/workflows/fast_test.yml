name: Fast CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-fast:
    name: Fast Test on ${{ matrix.os }} (${{ matrix.asset_name_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_name_suffix: linux-x64
            vse_name: vse
            vsc_name: vsc
          - os: macos-latest
            asset_name_suffix: macos-arm64
            vse_name: vse
            vsc_name: vsc
          - os: windows-latest
            asset_name_suffix: windows-x64
            msvc_arch: x64
            vse_name: vse.exe
            vsc_name: vsc.exe
          - os: ubuntu-24.04-arm
            asset_name_suffix: linux-arm64
            vse_name: vse
            vsc_name: vsc
          - os: windows-11-arm
            asset_name_suffix: windows-arm64
            msvc_arch: arm64
            vse_name: vse.exe
            vsc_name: vsc.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Git tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build Project
        uses: ./.github/actions/build
        with:
          cmake_preset: 'Release'

      - name: Test Project
        uses: ./.github/actions/test
        with:
          cmake_preset: 'Release'